<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stats Preview Card</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin:0; padding:0; font-family: 'Inter', sans-serif; }

  body {
    background: hsl(233, 47%, 7%);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .card {
    background: hsl(244, 38%, 16%);
    border-radius: 15px;
    overflow: hidden;
    max-width: 700px;
    display: flex;
    flex-direction: row;
    color: hsl(0,0%,100%);
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
  }

  .card .left {
    background: hsl(277, 64%, 61%);
    padding: 40px;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .card .left h1 {
    font-size: 32px;
    margin-bottom: 20px;
  }

  .card .left p {
    color: hsl(0,0%,100%);
    opacity: 0.75;
    font-size: 16px;
    line-height: 1.5;
  }

  .card .right {
    padding: 40px;
    flex: 1;
    background: hsl(233, 47%, 7%);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .stat h2 {
    font-size: 28px;
    color: hsl(0,0%,100%);
    margin-bottom: 5px;
  }

  .stat p {
    font-size: 14px;
    color: hsl(0,0%,100%);
    opacity: 0.75;
  }

  @media(max-width: 768px){
    .card {
      flex-direction: column;
    }
    .card .right {
      flex-direction: row;
      justify-content: space-around;
      padding: 30px;
    }
    .stat {
      align-items: center;
    }
  }

  @media(max-width: 480px){
    .card .left {
      padding: 30px;
    }
    .card .right {
      flex-direction: column;
      gap: 15px;
      padding: 30px;
    }
    .stat h2 { font-size: 24px; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="left">
    <h1>Get insights that help your business grow.</h1>
    <p>Discover the benefits of data analytics and make better decisions regarding revenue, customer experience, and overall efficiency.</p>
  </div>
  <div class="right">
    <div class="stat">
      <h2>10k+</h2>
      <p>Companies</p>
    </div>
    <div class="stat">
      <h2>314</h2>
      <p>Templates</p>
    </div>
    <div class="stat">
      <h2>12M+</h2>
      <p>Queries</p>
    </div>
  </div>
</div>

</body>
</html>
