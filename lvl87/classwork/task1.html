<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Kumbh Sans', sans-serif;
    }

    body {
      background-color: hsl(210, 46%, 95%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background-color: hsl(0, 0%, 100%);
      width: 350px;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 15px 25px rgba(0,0,0,0.1);
      text-align: center;
    }

    .card img.cover {
      width: 100%;
      height: 120px;
      object-fit: cover;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 5px solid white;
      margin-top: -50px;
    }

    .card h1 {
      font-size: 22px;
      margin: 15px 0 5px;
      color: hsl(228, 12%, 48%);
    }

    .card p {
      font-size: 14px;
      color: hsl(228, 12%, 48%);
      margin-bottom: 20px;
    }

    .stats {
      display: flex;
      border-top: 1px solid hsl(228, 12%, 90%);
    }

    .stats div {
      flex: 1;
      padding: 15px;
      border-right: 1px solid hsl(228, 12%, 90%);
    }

    .stats div:last-child {
      border-right: none;
    }

    .stats div h2 {
      font-size: 18px;
      color: hsl(230, 17%, 14%);
      margin-bottom: 5px;
    }

    .stats div p {
      font-size: 12px;
      color: hsl(228, 12%, 48%);
    }

    @media (max-width: 400px) {
      .card {
        width: 90%;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="cover" src="https://images.unsplash.com/photo-1503264116251-35a269479413?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=MnwxMTc3M3wwfDF8c2VhcmNofDF8fGNvdmVyfGVufDB8fHx8MTY5NzUyNTQxMw&ixlib=rb-4.0.3&q=80&w=400" alt="Cover photo">
    <img class="avatar" src="https://randomuser.me/api/portraits/men/32.jpg" alt="Avatar">
    <h1>John Doe</h1>
    <p>Frontend Developer</p>
    <div class="stats">
      <div>
        <h2>80K</h2>
        <p>Followers</p>
      </div>
      <div>
        <h2>803K</h2>
        <p>Likes</p>
      </div>
      <div>
        <h2>1.4K</h2>
        <p>Photos</p>
      </div>
    </div>
  </div>
</body>
</html>
