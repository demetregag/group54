<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Links Profile</title>
<style>
  /* Base styles */
  body {
    font-family: 'Arial', sans-serif;
    background-color: #f0f4f8;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 1rem;
  }

  .profile-card {
    background-color: #fff;
    width: 100%;
    max-width: 400px;
    padding: 2rem;
    border-radius: 1rem;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    text-align: center;
    transition: transform 0.3s;
  }

  .profile-card img {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 1rem;
  }

  .profile-card h1 {
    margin: 0.5rem 0;
    font-size: 1.5rem;
  }

  .profile-card p {
    font-size: 0.9rem;
    color: #555;
    margin: 0;
  }

  .social-links {
    margin-top: 1.5rem;
    display: flex;
    justify-content: center;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .social-links a {
    text-decoration: none;
    color: #fff;
    width: 40px;
    height: 40px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: transform 0.2s;
    font-weight: bold;
  }

  .social-links a:hover {
    transform: scale(1.1);
  }

  .social-links .github { background-color: #333; }
  .social-links .linkedin { background-color: #0077b5; }
  .social-links .twitter { background-color: #1da1f2; }
  .social-links .instagram { background-color: #e1306c; }

  /* Responsive styles */
  @media (max-width: 500px) {
    .profile-card {
      padding: 1.5rem;
    }

    .profile-card img {
      width: 100px;
      height: 100px;
    }

    .profile-card h1 {
      font-size: 1.3rem;
    }

    .profile-card p {
      font-size: 0.8rem;
    }

    .social-links a {
      width: 35px;
      height: 35px;
      font-size: 0.8rem;
    }
  }
</style>
</head>
<body>

<div class="profile-card">
  <img src="https://via.placeholder.com/120" alt="Profile Picture">
  <h1>John Doe</h1>
  <p>Web Developer | New York, USA</p>
  <div class="social-links">
    <a href="#" class="github">G</a>
    <a href="#" class="linkedin">L</a>
    <a href="#" class="twitter">T</a>
    <a href="#" class="instagram">I</a>
  </div>
</div>

</body>
</html>
