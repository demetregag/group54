<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Preview Card</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: hsl(210, 46%, 95%);
    }

    .card {
      background-color: #fff;
      width: 350px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .card:hover {
      transform: translateY(-10px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }

    .card img {
      width: 100%;
      display: block;
    }

    .card-content {
      padding: 20px;
    }

    .category {
      text-transform: uppercase;
      font-size: 12px;
      color: hsl(212, 23%, 69%);
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .title {
      font-size: 20px;
      font-weight: bold;
      color: hsl(217, 19%, 35%);
      margin-bottom: 15px;
      line-height: 1.2;
    }

    .description {
      font-size: 14px;
      color: hsl(212, 23%, 69%);
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .author {
      display: flex;
      align-items: center;
    }

    .author img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      margin-right: 15px;
    }

    .author-info {
      display: flex;
      flex-direction: column;
    }

    .author-info span:first-child {
      font-size: 14px;
      color: hsl(217, 19%, 35%);
      font-weight: bold;
    }

    .author-info span:last-child {
      font-size: 12px;
      color: hsl(212, 23%, 69%);
    }

    @media (max-width: 400px) {
      .card {
        width: 90%;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1612831455546-91828d08b7b0?auto=format&fit=crop&w=800&q=80" alt="Blog Image">
    <div class="card-content">
      <div class="category">Technology</div>
      <div class="title">Understanding the Future of AI in Daily Life</div>
      <div class="description">
        Explore how artificial intelligence is shaping the way we work, learn, and interact with the world around us.
      </div>
      <div class="author">
        <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="Author">
        <div class="author-info">
          <span>John Doe</span>
          <span>Oct 18, 2025</span>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
