<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Summary</title>
  <style>
    /* Reset and global styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Arial', sans-serif;
    }

    body, html {
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: hsl(212, 23%, 69%);
    }

    /* Card container */
    .card {
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
      width: 300px;
      text-align: center;
      padding: 20px;
    }

    /* Hero image */
    .hero {
      background-color: hsl(214, 47%, 23%);
      border-radius: 50%;
      width: 70px;
      height: 70px;
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .hero img {
      width: 40px;
      height: 40px;
    }

    /* Title */
    h1 {
      font-size: 18px;
      color: hsl(217, 19%, 35%);
      margin-bottom: 10px;
    }

    /* Description */
    p {
      font-size: 14px;
      color: hsl(217, 19%, 35%);
      margin-bottom: 20px;
    }

    /* Button */
    button {
      background-color: hsl(176, 68%, 64%);
      color: white;
      border: none;
      border-radius: 5px;
      padding: 10px 20px;
      cursor: pointer;
      font-size: 14px;
      width: 100%;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: hsl(176, 68%, 50%);
    }

    /* Attribution */
    .attribution {
      font-size: 12px;
      color: hsl(217, 19%, 35%);
    }

    /* Responsive design */
    @media (max-width: 400px) {
      .card {
        width: 90%;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="hero">
      <img src="https://via.placeholder.com/40" alt="Music Icon">
    </div>
    <h1>Order Summary</h1>
    <p>You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!</p>
    <p><strong>Annual Plan</strong><br>$59.99/year</p>
    <button>Proceed to Payment</button>
    <p class="attribution">Challenge by <a href="https://www.frontendmentor.io/challenges/order-summary-component-QlPmajDUj" target="_blank">Frontend Mentor</a></p>
  </div>

</body>
</html>
