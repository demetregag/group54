<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base Apparel Coming Soon</title>
<link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Global Styles */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Kumbh Sans', sans-serif;
    background-color: #f2f2f2;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .container {
    background-color: #fff;
    max-width: 450px;
    width: 100%;
    border-radius: 15px;
    padding: 40px 30px;
    text-align: center;
    box-shadow: 0 10px 20px rgba(0,0,0,0.1);
  }

  .logo {
    margin-bottom: 30px;
  }

  h1 {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 20px;
    color: #333;
  }

  p {
    font-size: 14px;
    color: #777;
    margin-bottom: 30px;
    line-height: 1.5;
  }

  form {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  input[type="email"] {
    width: 100%;
    padding: 12px 15px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 5px;
  }

  input[type="email"].error {
    border-color: red;
  }

  .error-message {
    font-size: 12px;
    color: red;
    display: none;
    text-align: left;
    width: 100%;
  }

  button {
    width: 100%;
    padding: 12px;
    background-color: #ff7a00;
    color: #fff;
    border: none;
    border-radius: 5px;
    font-weight: 700;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }

  button:hover {
    background-color: #e66e00;
  }

  /* Responsive */
  @media (max-width: 480px) {
    .container {
      padding: 30px 20px;
    }

    h1 {
      font-size: 24px;
    }

    p {
      font-size: 13px;
    }
  }
</style>
</head>
<body>

<div class="container">
  <img src="images/logo.svg" alt="Base Apparel Logo" class="logo">
  <h1>We're coming soon</h1>
  <p>Hello fellow shoppers! We're currently building our new fashion store. Add your email below to stay up-to-date with announcements and our launch deals.</p>
  
  <form id="signup-form">
    <input type="email" id="email" placeholder="Email Address" required>
    <div class="error-message" id="error-message">Please provide a valid email</div>
    <button type="submit">Notify Me</button>
  </form>
</div>

<script>
  const form = document.getElementById('signup-form');
  const emailInput = document.getElementById('email');
  const errorMessage = document.getElementById('error-message');

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    const email = emailInput.value.trim();

    if(!validateEmail(email)){
      emailInput.classList.add('error');
      errorMessage.style.display = 'block';
    } else {
      emailInput.classList.remove('error');
      errorMessage.style.display = 'none';
      alert('Thanks for subscribing!');
      form.reset();
    }
  });

  function validateEmail(email){
    const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    return re.test(email);
  }
</script>

</body>
</html>
