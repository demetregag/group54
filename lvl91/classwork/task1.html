<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        /* Global Styles */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Kumbh Sans', sans-serif;
  background-color: #f1f1f1;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

main {
  width: 100%;
  padding: 20px;
}

.newsletter-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  max-width: 1200px;
  margin: 0 auto;
}

.image-container {
  position: relative;
  width: 100%;
  max-width: 600px;
  margin-bottom: 40px;
}

.desktop-image {
  display: block;
  width: 100%;
  height: auto;
}

.mobile-image {
  display: none;
  width: 100%;
  height: auto;
}

.content h1 {
  font-size: 36px;
  font-weight: 600;
  margin-bottom: 10px;
}

.content p {
  font-size: 14px;
  color: #777;
  margin-bottom: 20px;
}

.content ul {
  list-style-type: none;
  margin-bottom: 40px;
}

.content ul li {
  font-size: 14px;
  color: #777;
  margin-bottom: 10px;
}

form {
  width: 100%;
  max-width: 400px;
  margin-bottom: 20px;
}

form label {
  display: block;
  font-size: 14px;
  color: #333;
  margin-bottom: 5px;
}

form input {
  width: 100%;
  padding: 10px;
  font-size: 14px;
  border: 1px solid #ccc;
  border-radius: 5px;
  margin-bottom: 10px;
}

form button {
  width: 100%;
  padding: 10px;
  font-size: 14px;
  background-color: #ff7a00;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

form button:hover {
  background-color: #e66e00;
}

.error-message {
  font-size: 12px;
  color: red;
}

.success-message {
  background-color: #e0f7e0;
  padding: 20px;
  border-radius: 5px;
  border: 1px solid #4caf50;
  margin-top: 20px;
}

.success-message p {
  font-size: 14px;
  color: #333;
}

.success-message button {
  padding: 5px 10px;
  font-size: 14px;
  background-color: #4caf50;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

.success-message button:hover {
  background-color: #45a049;
}

/* Responsive Styles */
@media (max-width: 768px) {
  .desktop-image {
    display: none;
  }

  .mobile-image {
    display: block;
  }
}

    </style>
</body>
</html>
