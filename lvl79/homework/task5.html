<body>
    <script>
let obj5 = { id: 1, info: { city: "Tbilisi" }, name: "Luka" };
for (let key in obj5) {
    if (typeof obj5[key] === "object" && obj5[key] !== null && !Array.isArray(obj5[key])) {
        console.log("Nested object found at key: " + key);
    }
}        
    </script>
</body>
