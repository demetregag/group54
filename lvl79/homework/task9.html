<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
let inputs = [];
let input;
do {
    input = prompt("Enter a number or 'stop' to finish");
    if (input !== "stop" && input !== null) {
        inputs.push(input);
    }
} while (input !== "stop" && input !== null);
console.log(inputs);        
    </script>
</body>
</html>
