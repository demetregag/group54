    <script>
console.log("Task 5:");
for (let i = 1; i <= 20; i++) {
  if (i === 13) break;
  console.log(i);
}

console.log("\nTask 6:");
const colors = ["red", "green", "yellow", "blue", "purple"];
for (let color of colors) {
  if (color === "blue") break;
  console.log(color);
}

console.log("\nTask 7:");
for (let i = 1; i <= 50; i++) {
  if (i % 4 === 0 && i % 5 === 0) break;
  console.log(i);
}

console.log("\nTask 8:");
const word = "fantastic";
for (let letter of word) {
  if (letter === "a") break;
  console.log(letter);
}

console.log("\nTask 9:");
let sum = 0;
for (let i = 1; ; i++) {
  sum += i;
  if (sum >= 100) break;
  console.log(`Added ${i}, total is ${sum}`);
}

    </script>
