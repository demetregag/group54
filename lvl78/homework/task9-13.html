<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
let numbers = [1, 2, 3, 4, 5];
for (let num of numbers) {
    console.log(num);
}

let text = "hello";
for (let char of text) {
    console.log(char);
}

let nums = [10, 20, 30];
let sum = 0;
for (let n of nums) {
    sum += n;
}
console.log(sum);

let values = [3, 6, 9, 12, 15];
for (let val of values) {
    if (val % 2 === 0) {
        console.log(val);
    }
}

let names = ["Ana", "Luka", "Nino", "Gio"];
for (let name of names) {
    console.log(name);
}

    </script>
</body>
</html>
