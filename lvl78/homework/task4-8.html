<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
let i = 1;
do {
    console.log(i);
    i++;
} while (i <= 5);

let j = 2;
do {
    if (j % 2 === 0) {
        console.log(j);
    }
    j++;
} while (j <= 10);

let k = 10;
do {
    console.log(k);
    k--;
} while (k >= 1);

let num;
do {
    num = prompt("Enter a number greater than 100");
} while (num <= 100 && num !== null);

let total = 0;
let x = 1;
do {
    total += x;
    x++;
} while (x <= 10);
console.log(total);

    </script>
</body>
</html>
